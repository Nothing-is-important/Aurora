appId: com.aurora.dsh
productName: Aurora DSH
directories:
  output: ../release/dsh-shell
files:
  - main.mjs
  - preload.cjs
  - pages/**/*
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  # 自带 dsh 运行时：不依赖机器上的全局安装（机器全局包可能损坏/缺失）。
  # 逐项指定：整目录复制时 builder 会对含 package.json 的目录做模块剪枝。
  - from: .dsh-runtime/node_modules
    to: dsh-runtime/node_modules
    filter:
      - "**/*"
      - "!**/*.map"
  - from: .dsh-runtime/package.json
    to: dsh-runtime/package.json
  - from: .dsh-runtime/package-lock.json
    to: dsh-runtime/package-lock.json
electronVersion: 43.4.0
win:
  target:
    - nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aurora DSH
  artifactName: Aurora-DSH-Setup-${version}.${ext}
