appId: com.aurora.dsh
productName: Aurora DSH
directories:
  output: ../release/dsh-shell
files:
  - main.mjs
  - preload.cjs
  - pages/**/*
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  # 自带 dsh 运行时：不依赖机器上的全局安装（机器全局包可能损坏/缺失）
  - from: .dsh-runtime
    to: dsh-runtime
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/node_modules/.cache/**"
electronVersion: 43.4.0
win:
  target:
    - nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aurora DSH
  artifactName: Aurora-DSH-Setup-${version}.${ext}
