<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Aurora 设置</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #101014; color: #d5d5dc; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column; user-select: none;
  }
  .dragbar { height: 32px; flex: none; -webkit-app-region: drag; }
  .wrap { flex: 1; overflow-y: auto; padding: 8px 18px 18px; }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .section { margin-bottom: 16px; }
  .section h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #8a8a93; margin-bottom: 8px; }
  .field { width: 100%; box-sizing: border-box; border-radius: 10px; background: rgba(255,255,255,.07); border: 1px solid transparent; padding: 9px 12px; font-size: 13px; color: #d5d5dc; outline: none; font-family: inherit; }
  .field:focus { border-color: #0a84ff; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  button {
    font-family: inherit; font-size: 12.5px; font-weight: 600; border: none; cursor: pointer;
    border-radius: 9px; padding: 9px 16px; transition: transform .15s, filter .15s;
  }
  button:active { transform: scale(.96); }
  .primary { background: #0a84ff; color: #fff; }
  .primary:hover { filter: brightness(1.1); }
  .ghost { background: rgba(255,255,255,.07); color: #d5d5dc; }
  .ghost:hover { background: rgba(255,255,255,.12); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 13px; }
  .toggle-row span.hint { font-size: 11px; color: #8a8a93; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.18); transition: .2s; cursor: pointer; }
  .slider::before { content: ''; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + .slider { background: #30d158; }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  .msg { font-size: 11.5px; color: #30d158; margin-top: 6px; min-height: 15px; }
  .msg.err { color: #ff453a; }
  .meta { font-size: 11px; color: #8a8a93; line-height: 1.7; }
  .meta b { color: #d5d5dc; font-weight: 600; }
</style>
</head>
<body>
<div class="dragbar"></div>
<div class="wrap">
  <h1>Aurora 设置</h1>

  <div class="section">
    <h2>DeepSeek Harness</h2>
    <input id="dshHome" class="field" placeholder="数据目录（留空 = 应用自带目录）" spellcheck="false" />
    <p style="font-size:11px;color:#8a8a93;margin-top:6px;line-height:1.6">
      会话、凭据与配置存于此目录。可指向已有部署（如 F:\.dsh）直接复用其 API Key 与会话。
    </p>
    <div class="row">
      <button class="primary" id="applyHome">应用（重启服务）</button>
      <span class="msg" id="homeMsg"></span>
    </div>
  </div>

  <div class="section">
    <h2>常规</h2>
    <label class="toggle-row"><span>开机自启</span><span class="switch"><input type="checkbox" id="autostart" /><span class="slider"></span></span></label>
    <label class="toggle-row"><span>启动时最小化到托盘</span><span class="switch"><input type="checkbox" id="startHidden" /><span class="slider"></span></span></label>
    <label class="toggle-row"><span>关闭窗口时最小化到托盘</span><span class="switch"><input type="checkbox" id="closeToTray" /><span class="slider"></span></span></label>
  </div>

  <div class="section">
    <h2>运行状态</h2>
    <p class="meta" id="meta">加载中…</p>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id)
  let state = null

  const render = (s) => {
    state = s
    $('dshHome').value = s.dshHome || ''
    $('autostart').checked = !!s.autostart
    $('startHidden').checked = !!s.startHidden
    $('closeToTray').checked = !!s.closeToTray
    $('meta').innerHTML =
      `版本 <b>v${s.version || '?'}</b> · 状态 <b>${s.status || '?'}</b>` +
      (s.url ? `<br/>服务地址 <b>${s.url}</b>` : '')
  }

  window.auroraShell?.getSettings().then(render)

  $('applyHome').addEventListener('click', async () => {
    const el = $('homeMsg')
    el.textContent = '正在切换数据目录并重启服务…'
    el.className = 'msg'
    try {
      const r = await window.auroraShell.setSettings({ dshHome: $('dshHome').value.trim() })
      if (r.restarted) {
        el.textContent = '已切换并重启服务'
        window.auroraShell.getSettings().then(render)
      } else if (r.error) {
        el.textContent = '失败：' + r.error
        el.className = 'msg err'
      } else {
        el.textContent = '已保存'
      }
    } catch (err) {
      el.textContent = '失败：' + String(err)
      el.className = 'msg err'
    }
  })

  for (const key of ['autostart', 'startHidden', 'closeToTray']) {
    $(key).addEventListener('change', () => {
      void window.auroraShell.setSettings({ [key]: $(key).checked })
    })
  }

  // 状态推送（服务重启/崩溃时刷新）
  window.auroraShell?.onState?.((s) => {
    if (s && typeof s.phase === 'string') {
      window.auroraShell.getSettings().then(render)
    }
  })
</script>
</body>
</html>
